<!DOCTYPE html> 

<html> 

<head> 

<title>JavaScript Learning Progress Dashboard</title> 

<link rel="stylesheet" href="style.css"> 

</head> 

<body> 

<div class="container"> 

<h1>JavaScript Learning Progress Dashboard</h1> 

<form> 

<label>Name</label> 

<input type=”text” id=”name”><BR><BR> 

<label>Roll Number</label> 

<input type=”text” id=”roll”> <BR><BR>

<label>Topics Completed</label> 

<input type=”number” id=”topics”> <BR><BR>

<label>Practice Hours</label> 

<input type=”number” id=”hours”> <BR><BR>

<label>Confidence Rating (1-10)</label> 

<input type=”number” id=”rating”> <BR><BR>

<button type=”button” onclick="checkProgress()">Check Progress</button> <BR>

</form> 

<h3 id=”result”></h3> 

<h3>JavaScript Topics Learned</h3> 

<ul id=”jsTopics”></ul> 

</div> 

<script src=”script.js”></script> 

</body> 

</html>
